SERIAL 0 115200

UI menu.c32

PROMPT 0
TIMEOUT 100

MENU TITLE HWOS - Hacker Web OS
MENU BACKGROUND splash.png
MENU COLOR border       30;44   #40ffffff #20ffffff none
MENU COLOR title        1;36;44 #ff00ff00 #20ffffff none
MENU COLOR sel          7;37;40 #ff00ff00 #20ffffff none
MENU COLOR unsel        37;44   #ffffffff #20ffffff none
MENU COLOR help         37;40   #ff00ff00 #20ffffff none
MENU COLOR timeout_msg  37;40   #ff00ff00 #20ffffff none
MENU COLOR timeout      1;37;40 #ff00ff00 #20ffffff none
MENU COLOR msg07        37;40   #ff00ff00 #20ffffff none
MENU COLOR tab_msg      37;40   #ff00ff00 #20ffffff none

DEFAULT hwos

LABEL hwos
  MENU LABEL ^HWOS - Hacker Web OS
  LINUX /%INSTALL_DIR%/boot/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/intel-ucode.img,%INSTALL_DIR%/boot/amd-ucode.img,%INSTALL_DIR%/boot/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=8G quiet splash loglevel=3 rd.systemd.show_status=false rd.udev.log_level=3

LABEL hwos-ram
  MENU LABEL HWOS - ^Copy to RAM
  LINUX /%INSTALL_DIR%/boot/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/intel-ucode.img,%INSTALL_DIR%/boot/amd-ucode.img,%INSTALL_DIR%/boot/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=8G cow_label=COW quiet splash loglevel=3 rd.systemd.show_status=false rd.udev.log_level=3 copytoram

LABEL hwos-install
  MENU LABEL HWOS - ^Install to Disk
  LINUX /%INSTALL_DIR%/boot/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/intel-ucode.img,%INSTALL_DIR%/boot/amd-ucode.img,%INSTALL_DIR%/boot/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=8G quiet splash loglevel=3 rd.systemd.show_status=false rd.udev.log_level=3 hwos.installer

LABEL memtest
  MENU LABEL ^Memtest86+
  LINUX /%INSTALL_DIR%/boot/memtest86+/memtest
  INITRD /%INSTALL_DIR%/boot/memtest86+/memtest

LABEL reboot
  MENU LABEL ^Reboot
  COM32 reboot.c32

LABEL poweroff
  MENU LABEL ^Power Off
  COM32 poweroff.c32
