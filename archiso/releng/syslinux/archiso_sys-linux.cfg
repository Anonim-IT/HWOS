SERIAL 0 115200
UI menu.c32
PROMPT 0
TIMEOUT 100
MENU TITLE HWOS — Hacker Web OS
MENU BACKGROUND splash.png

DEFAULT hwos

LABEL hwos
  MENU LABEL ^Запустить HWOS
  LINUX /%INSTALL_DIR%/boot/vmlinuz-linux-6.1
  INITRD /%INSTALL_DIR%/boot/intel-ucode.img,%INSTALL_DIR%/boot/amd-ucode.img,%INSTALL_DIR%/boot/initramfs-linux-6.1.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=8G quiet splash loglevel=3

LABEL install
  MENU LABEL ^Установить HWOS на диск
  LINUX /%INSTALL_DIR%/boot/vmlinuz-linux-6.1
  INITRD /%INSTALL_DIR%/boot/intel-ucode.img,%INSTALL_DIR%/boot/amd-ucode.img,%INSTALL_DIR%/boot/initramfs-linux-6.1.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=8G quiet hwos.installer

LABEL ram
  MENU LABEL ^Загрузить в RAM
  LINUX /%INSTALL_DIR%/boot/vmlinuz-linux-6.1
  INITRD /%INSTALL_DIR%/boot/intel-ucode.img,%INSTALL_DIR%/boot/amd-ucode.img,%INSTALL_DIR%/boot/initramfs-linux-6.1.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=8G copytoram

LABEL reboot
  MENU LABEL ^Перезагрузка
  COM32 reboot.c32

LABEL poweroff
  MENU LABEL ^Выключение
  COM32 poweroff.c32
