SERIAL 0 115200

UI menu.c32

PROMPT 0
TIMEOUT 100

MENU TITLE HWOS — Hacker Web OS (Сделано в Санкт-Петербурге, PXE)
MENU BACKGROUND splash.png

DEFAULT hwos

LABEL hwos
  MENU LABEL ^HWOS — Hacker Web OS (Санкт-Петербург)
  LINUX /%INSTALL_DIR%/boot/vmlinuz-linux-hacker
  INITRD /%INSTALL_DIR%/boot/intel-ucode.img,%INSTALL_DIR%/boot/amd-ucode.img,%INSTALL_DIR%/boot/initramfs-linux-hacker.img
  APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cow_spacesize=8G quiet splash loglevel=3

LABEL reboot
  MENU LABEL ^Reboot
  COM32 reboot.c32

LABEL poweroff
  MENU LABEL ^Power Off
  COM32 poweroff.c32
